<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BokaSafe Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <img src="img/boka.png" alt="BokaDev Logo" class="logo-img">
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="#" id="lighthousesMenu" class="active">Lighthouses</a></li>
                    <li><a href="#" id="documentsMenu">Documents</a></li>
                    <li><a href="#" id="fishFarmsMenu">Fish Farms</a></li>
                    <li><a href="#" id="marineProtectedAreasMenu">Marine Protected Areas</a></li>
                    <li><a href="#" id="marinasMenu">Marinas</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Lighthouses View -->
            <section id="lighthousesView" class="view active">
                <header class="header"><h1>Lighthouses</h1></header>
                <table class="table">
                    <thead><tr><th>ID</th><th>Name</th><th>Edit</th></tr></thead>
                    <tbody id="lighthouse-list"></tbody>
                </table>
            </section>

            <!-- Documents View -->
            <section id="documentsView" class="view hidden">
                <header class="header"><h1>Documents</h1></header>
                <button class="upload-btn" id="uploadBtn">Add New Document</button>
                <div id="uploadForm" class="upload-form hidden">
                    <h3>Upload New Document</h3>
                    <form id="documentUploadForm" enctype="multipart/form-data">
                        <label for="documentFile">Choose File</label>
                        <input type="file" id="documentFile" name="file" accept="application/pdf" required>
                        <div class="form-buttons">
                            <button type="submit" class="save-text">Upload</button>
                            <button type="button" class="cancel-text" onclick="toggleUploadForm()">Cancel</button>
                        </div>
                    </form>
                </div>
                <table class="table" id="documentsTable">
                    <thead><tr><th>Document ID</th><th>Document Name</th><th>Actions</th></tr></thead>
                    <tbody id="documents-list"></tbody>
                </table>
            </section>

            <!-- Fish Farms View -->
            <section id="fishFarmsView" class="view hidden">
                <header class="header"><h1>Fish Farms</h1></header>
                <table class="table">
                    <thead><tr><th>ID</th><th>Location</th></tr></thead>
                    <tbody id="fish-farms-list"></tbody>
                </table>
            </section>

            <!-- Marine Protected Areas View -->
            <section id="marineProtectedAreasView" class="view hidden">
                <header class="header"><h1>Marine Protected Areas</h1></header>
                <table class="table">
                    <thead><tr><th>ID</th><th>Name</th><th>Location</th></tr></thead>
                    <tbody id="marine-protected-areas-list"></tbody>
                </table>
            </section>

            <!-- Marinas View -->
            <section id="marinasView" class="view hidden">
                <header class="header"><h1>Marinas</h1></header>
                <table class="table">
                    <thead><tr><th>ID</th><th>Name</th><th>Location</th></tr></thead>
                    <tbody id="marinas-list"></tbody>
                </table>
            </section>

            <!-- Lighthouse Edit Popup (Integrated Correctly Here) -->
            <div id="editFormPopup" class="popup">
                <div class="popup-content">
                    <button class="close-btn" onclick="closeForm()">&times;</button>
                    <h2>Edit Lighthouse Status</h2>
                    <form id="editForm">
                        <input type="hidden" id="lighthouseId">
                        <label for="name">Name</label>
                        <input type="text" id="name" disabled>
                        <label for="location">Location</label>
                        <input type="text" id="location" disabled>
                        <label for="characteristics">Characteristics</label>
                        <input type="text" id="characteristics" disabled>
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="OK">OK</option>
                            <option value="Not OK">Not OK</option>
                        </select>
                        <div class="form-buttons">
                            <span class="cancel-text" onclick="cancelEdit()">Cancel</span>
                            <span class="save-text" onclick="saveStatus()">Save</span>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Notification -->
            <div id="notification" class="notification"></div>

        </main>
    </div>

    <script src="scripts/dashboard.js"></script>
</body>
</html>
